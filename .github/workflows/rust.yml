name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run tests with sync feature
      run: cargo test --verbose -F sync
    - name: Run tests with cursor feature
      run: cargo test --verbose -F cursor
    - name: Run tests with hashbrown feature
      run: cargo test --verbose -F hashbrown
    - name: Run tests with all features
      run: cargo test --verbose --all-features
